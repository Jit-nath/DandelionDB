[package]
name = "dandeliondb"
version = "0.2.0"
edition = "2024"
description = "An embedded, single-file Rust database with typed records and vector retrieval"
license = "MIT"
repository = "https://github.com/Jit-nath/DandelionDB.git"
homepage = "https://github.com/Jit-nath/DandelionDB"
readme = "README.md"
keywords = ["database", "embedded", "vector-search", "search", "storage"]
categories = ["database-implementations", "data-structures", "embedded"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]

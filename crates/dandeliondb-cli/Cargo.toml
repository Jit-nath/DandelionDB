[package]
name = "dandeliondb-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line tools for DandelionDB"
license = "MIT"

[[bin]]
name = "dandeliondb"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dandeliondb = { path = "../dandeliondb" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.15"
